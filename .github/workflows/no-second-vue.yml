name: No second Vue

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install root dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: NODE_OPTIONS=--openssl-legacy-provider yarn lint
      - name: Unit tests
        run: NODE_OPTIONS=--openssl-legacy-provider yarn test:unit
      - name: Build library
        run: NODE_OPTIONS=--openssl-legacy-provider yarn build
      - name: Verify no second Vue
        working-directory: verification
        run: npm run verify:no-second-vue
