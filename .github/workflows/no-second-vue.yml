name: No second Vue

on:
  push:
  workflow_dispatch:

concurrency:
  group: no-second-vue-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --no-fix
      - name: Unit tests
        run: npm run test:unit
      - name: Build library
        run: NODE_ENV=production NODE_OPTIONS=--openssl-legacy-provider npm run build
      - name: Check dist is in sync
        run: test -z "$(git status --porcelain dist/)"
      - name: Install verification dependencies
        working-directory: verification
        run: npm ci
      - name: Verify no second Vue
        working-directory: verification
        run: NODE_ENV=production npm run verify:no-second-vue
