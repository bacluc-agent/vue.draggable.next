name: No second Vue

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Lint
        run: NODE_OPTIONS=--openssl-legacy-provider npm run lint
      - name: Unit tests
        run: NODE_OPTIONS=--openssl-legacy-provider npm run test:unit
      - name: Build library
        run: NODE_ENV=production NODE_OPTIONS=--openssl-legacy-provider npm run build
      - name: Verify no second Vue
        working-directory: verification
        run: NODE_ENV=production npm run verify:no-second-vue
